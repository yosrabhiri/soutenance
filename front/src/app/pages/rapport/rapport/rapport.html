<div class="container">
<h3>Déposer Rapport</h3>

<form [formGroup]="group" (ngSubmit)="submit()">
  <div class="formContainer">

    <!-- Nom + Prénom -->
    <div class="fieldsContainer">
      <!-- Nom -->
      <mat-form-field class="fieldstyle fieldMargin">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom" readonly>
      </mat-form-field>

      <!-- Prénom -->
      <mat-form-field class="fieldstyle">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="prenom" readonly>
      </mat-form-field>
    </div>

    <div>
      <!-- Code sujet -->
      <mat-form-field class="fieldstyle fieldMargin">
        <mat-label>Code sujet</mat-label>
        <input matInput formControlName="code_sujet">
      </mat-form-field>
      <!-- Import rapport -->
      <mat-form-field class="fieldstyle" appearance="fill">
        <mat-label>Importer votre rapport</mat-label>
        <input matInput [value]="fileName" readonly>
        <button mat-icon-button matSuffix type="button" (click)="fileInput.click()">
          <mat-icon>attach_file</mat-icon>
        </button>
      </mat-form-field>

      <input type="file" #fileInput hidden (change)="onFileSelected($event)" accept=".pdf" />
  </div>
  <div>
      <!-- Mots clés avec chips -->
      <mat-form-field class="fieldstyle">
        <mat-label>Mots clés</mat-label>

       <mat-chip-grid #chipGrid aria-label="Mots clés">
  <ng-container *ngFor="let mot of motsCles.controls; let i = index; trackBy: trackByIndex">
    <mat-chip-row (removed)="removeMotCle(i)">
      {{ mot.value }}
      <button matChipRemove>
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip-row>
  </ng-container>
</mat-chip-grid>


        <input
          placeholder="Ajouter un mot clé..."
          [matChipInputFor]="chipGrid"
          [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
          (matChipInputTokenEnd)="addMotCle($event)" />
      </mat-form-field>

      
  </div>
  </div>

  <!-- Bouton submit -->
  <div class="buttonImpDiv">
    <button class="buttonImport" mat-raised-button type="submit">
      Déposer
    </button>
  </div>
</form>
</div>
