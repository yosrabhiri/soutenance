<div class="container">
    <h2>Historique</h2>
    @if(loading){
      <app-loading ></app-loading>}
      @else {
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
  <!-- Position Column -->
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type de stage</th>
    <td mat-cell *matCellDef="let element">{{element.type}}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="societe">
    <th mat-header-cell *matHeaderCellDef>Société</th>
    <td mat-cell *matCellDef="let element">{{element.societe}}</td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="dateDebut">
    <th mat-header-cell *matHeaderCellDef>Date début</th>
    <td mat-cell *matCellDef="let element">{{element.dateDebut}}</td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="dateFin">
    <th mat-header-cell *matHeaderCellDef>date fin</th>
    <td mat-cell *matCellDef="let element">{{element.dateFin}}</td>
  </ng-container>
  <ng-container matColumnDef="statut">
    <th mat-header-cell *matHeaderCellDef>Statut de stage</th>
    <td mat-cell *matCellDef="let element">
        <span [ngClass]="{ 'orange': element.statut=== 'en_attente', 'vert': element.statut== 'valide' }">

        {{element.statut}}</span></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
      mat-row
      (click)="clickedRows.add(row)"
      [class.demo-row-is-clicked]="clickedRows.has(row)"
      *matRowDef="let row; columns: displayedColumns;"
  ></tr>
</table>
      }
</div>
